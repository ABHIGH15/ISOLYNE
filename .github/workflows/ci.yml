name: Isolyne CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Typecheck Main App
      run: npx tsc --noEmit
    - name: Run Tests
      run: npm test
    - name: Typecheck Discord Bot
      working-directory: ./discord-bot
      run: npm ci && npm run typecheck
